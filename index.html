<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3ED">
<title>审美人格测试 · 12 题测出你的审美人格</title>
<style>
:root{
  --paper:#F6F3ED;
  --card:#FFFDF8;
  --ink:#1B1A17;
  --ink2:#6B675E;
  --ink3:#9C978C;
  --line:#DFD9CE;
  --accent:#1B1A17;
  --hfg:#F6F3ED;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;padding:0 24px 44px;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}

/* ── 封面 ── */
.top{padding:30px 0 0;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
h1{font-size:41px;line-height:1.24;margin:30px 0 0;letter-spacing:-.015em;font-weight:700}
.lead{margin:16px 0 0;color:var(--ink2);font-size:15px;line-height:1.78}
.rule{height:1px;background:var(--line);margin:30px 0 0;border:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink3);margin:16px 0 0}
.spacer{flex:1;min-height:24px}
.btn{appearance:none;border:0;background:var(--ink);color:var(--paper);
  font-family:inherit;font-size:16px;font-weight:600;padding:17px 20px;border-radius:10px;
  width:100%;min-height:56px;cursor:pointer;line-height:1.2}
.btn:active{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{font-size:14px;min-height:48px;padding:12px 16px}
.linkmuted{appearance:none;border:0;background:transparent;color:var(--ink3);
  font-family:inherit;font-size:13px;padding:14px 0;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px}
.footnote{font-size:12px;color:var(--ink3);text-align:center;margin:18px 0 0;line-height:1.7}

/* ── 答题 ── */
.qhead{padding:28px 0 0;display:flex;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--ink3)}
.qhead b{color:var(--ink);font-weight:600;font-size:14px}
.bar{height:2px;background:var(--line);margin:12px 0 0;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);width:0;transition:width .22s ease}
.qtext{font-size:23px;line-height:1.56;font-weight:600;margin:34px 0 0;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:10px;margin:22px 0 0}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:15px 16px;font-family:inherit;
  font-size:15.5px;line-height:1.6;color:var(--ink);cursor:pointer;min-height:56px}
.opt .ol{flex:0 0 21px;height:21px;border-radius:50%;border:1px solid var(--line);
  font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink3);margin-top:3px}
.opt .ot{flex:1}
.opt.sel{border-color:var(--ink);background:#FFFFFF}
.opt.sel .ol{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qfoot{margin-top:22px;display:flex;justify-content:flex-start}
.qfoot button{appearance:none;border:0;background:transparent;color:var(--ink2);
  font-family:inherit;font-size:14px;padding:12px 0;cursor:pointer}
.qfoot button.off{visibility:hidden}

/* ── 计算 ── */
#s-calc{align-items:center;justify-content:center}
.calcwrap{text-align:center;padding:60px 0}
.calcdot{width:9px;height:9px;border-radius:50%;background:var(--ink);margin:0 auto 22px;
  animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.22;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.calctext{font-size:15px;color:var(--ink2);letter-spacing:.02em}

/* ── 结果 ── */
.hero{border-radius:12px;padding:30px 26px 32px;margin:26px 0 0;
  background:var(--accent);color:var(--hfg);border:1px solid rgba(23,22,19,.10)}
.hero .no{font-size:11px;letter-spacing:.22em;opacity:.7;text-transform:uppercase}
.hero .school{font-size:14px;margin-top:20px;opacity:.78;letter-spacing:.04em}
.hero .role{font-size:37px;font-weight:700;line-height:1.22;margin-top:5px;letter-spacing:-.02em}
.desc{font-size:15px;line-height:1.9;color:var(--ink2);margin:24px 0 0}
.hookwrap{margin:26px 0 0;padding-left:16px;border-left:2px solid var(--accentrule,var(--accent))}
.hook{font-size:21px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.sectitle{font-size:11px;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;margin:30px 0 0}
.palette{display:flex;gap:8px;margin:12px 0 0}
.sw{flex:1}
.sw i{display:block;height:52px;border-radius:6px;border:1px solid rgba(0,0,0,.07)}
.sw span{display:block;font-size:10.5px;color:var(--ink3);margin-top:6px;letter-spacing:.04em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lastres{font-size:13px;color:var(--ink3);margin:20px 0 0}
.actions{display:flex;flex-direction:column;gap:10px;margin:28px 0 0}

/* ── 结果卡 ── */
.cardscreen{padding:22px 0 0}
.cardtop{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink3)}
.cardimgwrap{margin:16px 0 0;border-radius:10px;overflow:hidden;background:#EFEAE0;
  border:1px solid var(--line)}
#cardimg{display:block;width:100%;height:auto}
.cardhint{font-size:12px;color:var(--ink3);text-align:center;margin:14px 0 0;line-height:1.7}

@media (max-width:380px){
  h1{font-size:35px}
  .qtext{font-size:21px}
  .hero .role{font-size:32px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ① 封面 -->
  <section class="screen on" id="s-cover">
    <div class="top"><span>Aesthetic Persona</span><span>No.01 — No.10</span></div>
    <h1>审美人格<br>测试</h1>
    <p class="lead">12 个具体到有点烦人的场景题，测出你属于哪一种审美流派。<br>没有好坏，只有你选东西时那套说不清的标准。</p>
    <hr class="rule">
    <div class="meta"><span>12 题</span><span>约 1 分钟</span><span>10 种结果</span><span>可存图</span></div>
    <div class="spacer"></div>
    <button class="btn" id="startbtn">开始</button>
    <button class="linkmuted" id="resumebtn" hidden>继续上次进度</button>
    <p class="footnote">娱乐向，不必当真</p>
  </section>

  <!-- ② 答题 -->
  <section class="screen" id="s-quiz">
    <div class="qhead"><b id="qnum">1 / 12</b><span>选完自动下一题</span></div>
    <div class="bar"><i id="bar"></i></div>
    <h2 class="qtext" id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <div class="qfoot"><button id="back">← 上一题</button></div>
  </section>

  <!-- ③ 计算 -->
  <section class="screen" id="s-calc">
    <div class="calcwrap">
      <div class="calcdot"></div>
      <div class="calctext" id="calctext">正在判断…</div>
    </div>
  </section>

  <!-- ④ 结果 -->
  <section class="screen" id="s-result">
    <div class="hero">
      <div class="no" id="r-no">No.01</div>
      <div class="school" id="r-school"></div>
      <div class="role" id="r-role"></div>
    </div>
    <p class="desc" id="r-desc"></p>
    <div class="hookwrap"><div class="hook" id="r-hook"></div></div>
    <div class="sectitle">Your Palette</div>
    <div class="palette" id="r-pal"></div>
    <p class="lastres" id="r-last" hidden></p>
    <div class="actions">
      <button class="btn" id="cardbtn">生成结果卡</button>
      <button class="btn ghost" id="againbtn">重新测一次</button>
    </div>
    <p class="footnote">娱乐向，不必当真</p>
  </section>

  <!-- ⑤ 结果卡 -->
  <section class="screen" id="s-card">
    <div class="cardscreen">
      <div class="cardtop">
        <button class="linkmuted" id="backbtn" style="padding:6px 0">← 回到结果</button>
        <span id="cardstate">3 : 4 · 可存图</span>
      </div>
      <div class="cardimgwrap"><img id="cardimg" alt="审美人格结果卡"></div>
      <p class="cardhint">手机上长按图片保存；电脑点下面按钮另存为</p>
      <div class="actions">
        <button class="btn" id="savebtn">保存图片（2484 × 3312）</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ══════════════════ 一、题库（每题 4 选项，向量 = [S 饱和, C 繁简, T 时感, W 温度]） ══════════════════ */
var DIM = 5;   /* S 饱和 · C 繁简 · T 时感 · W 温度 · E 东方自然(−)/西方都市(+) */
var QUESTIONS = [

    { p:'04', t:'一个能折叠、什么都能往里塞的金属置物架' },

  { q:'衣柜里占地最多的颜色是？', o:[

    { p:'01', t:'阴天的天空、灰墙、没有人的走廊' },
    { p:'02', t:'甜品、咖啡拉花、堆满一桌的彩色' }
  ]},
  { q:'换手机壁纸，你会选？', o:[
    { p:'04', t:'深色金属拉丝，边角有点磨损' },
    { p:'05', t:'几乎全白，中间什么都没有' },

  ]},
  { q:'朋友说「你家有点像样板间」，你？', o:[

  { q:'送人礼物，你会选？', o:[

    { p:'02', t:'一盒包装就很吵的彩色礼盒' },
    { p:'04', t:'一把能用一辈子的多功能小刀' },
    { p:'06', t:'一个奶油色的小夜灯，抱着能睡' }
  ]},
  { q:'选一把椅子，你会挑？', o:[
    { p:'03', t:'深色实木配皮面，坐十年也不变形' },
    { p:'05', t:'原木、没有扶手、线条很细的一把' },
    { p:'07', t:'透明亚克力，坐上去还有点弹性' },

  ]},
  { q:'旅行时你拍什么？', o:[
    { p:'09', t:'一扇旧窗、半面墙，剩下的交给留白' },
    { p:'10', t:'雕像、台阶、阴影里看不清的东西' },
    { p:'01', t:'雾、雨、没什么人的街道' },
    { p:'02', t:'市集、招牌、颜色最杂的那个摊子' }
  ]},
  { q:'心情很差的时候，你会？', o:[
    { p:'04', t:'出门走很久，走到鞋脏了为止' },
    { p:'05', t:'把房间彻底清一遍，扔掉一半东西' },
    { p:'09', t:'泡一壶茶，坐着看水汽升上来' },
    { p:'06', t:'洗个热水澡，钻进最厚的那床被子' }
  ]},
  { q:'你更能接受哪种「丑」？', o:[
    { p:'07', t:'廉价，但有趣' },
    { p:'08', t:'旧，但真实' },
    { p:'09', t:'空，什么都没有' },
    { p:'10', t:'冷，有点压抑' }
  ]},
  { q:'你的工作台长什么样？', o:[
    { p:'01', t:'灰的键盘、灰的杯子，只有一样东西有颜色' },
    { p:'02', t:'摆满贴纸、手办、颜色很跳的小东西' },
    { p:'03', t:'只留一个笔筒和一盏灯，其余都收进去' },
    { p:'05', t:'一个电脑、一杯水，别的没有了' }
  ]},
  { q:'拍一张自拍，你会？', o:[
    { p:'04', t:'帽子口罩全戴上，几乎看不出脸' },
    { p:'06', t:'找个滤镜，让皮肤看起来软一点' },
    { p:'07', t:'开闪光灯，让光直接打到脸上' },
    { p:'08', t:'用很重的胶片滤镜，宁可糊一点' }
  ]}
];

/* 选项向量 = 该选项所属人格的质心（改质心即可整体调手感，不用逐题改数） */
function bindVectors(){
  var i,j,opt,per;
  for(i=0;i<QUESTIONS.length;i++){
    for(j=0;j<QUESTIONS[i].o.length;j++){
      opt=QUESTIONS[i].o[j];
      per=null;
      for(var k=0;k<PERSONAS.length;k++) if(PERSONAS[k].no===opt.p){ per=PERSONAS[k]; break; }
      opt.v = per ? per.c.slice() : new Array(DIM).fill(0);
    }
  }
}

/* ══════════════════ 二、人格配置（c = 质心，向量同题库） ══════════════════ */
var PERSONAS = [
  { no:'01', school:'莫兰迪派', role:'灰调隐士',
    main:'#A8A29B', pal:['#A8A29B','#C9C2B8','#6E6A66','#E8E2D9'],
    c:[-2,-0.5, 0.4, 0.4,-0.3],
    desc:'你买东西的第一反应是「这个颜色会不会太吵」。你的房间没有大块鲜艳的东西，但你分得清七八种灰。别人觉得你低调，其实你只是把力气都花在了差别很细的地方。',
    hook:'你的世界调过一层灰' },

  { no:'02', school:'多巴胺派', role:'糖分超标',
    main:'#FF5C8A', pal:['#FF5C8A','#FFC93C','#3EC1D3','#FF8C42'],
    c:[ 2, 0.7, 0.8,   2, 0.5],
    desc:'你选东西的标准只有一个——看一眼会不会让人想笑。桌上永远有几样没用但很亮的东西，它们存在的本身就是理由。生活已经够灰了，你负责当那个把饱和度调回去的人。',
    hook:'你需要的不是配色，是糖果店' },

  { no:'03', school:'老钱静奢', role:'无声富贵',
    main:'#1F2A24', pal:['#1F2A24','#C9B79C','#EFEAE0','#7A6A53'],
    c:[-1.3,-1.1,-1,-1.5, 1.5],
    desc:'你从不主动说某样东西多少钱。你买得少，但每一件都用很多年，边角磨出来的样子你反而更喜欢。你的品味不靠显眼，靠的是别人走近了才发现哪里不一样。',
    hook:'你从不说贵，但看得出来' },

  { no:'04', school:'废土机能', role:'生在废墟',
    main:'#4A4A45', pal:['#4A4A45','#8C7A5B','#B8B3A6','#2A2A26'],
    c:[0.8,   2, 1.5,  -2,   0],
    desc:'你偏爱一切看起来能扛事的东西：金属扣、粗织带、磨出毛边的帆布。好看对你来说不够，它还得有用、经得住、能带着走。你对「精致」没有意见，只是觉得它太容易坏。',

  { no:'05', school:'侘寂禅意', role:'空房间',
    main:'#DCD5C7', pal:['#DCD5C7','#B9AE9A','#8C8271','#F4EFE6'],
    c:[-2,-2.3, 0.3,   1,-0.5],
    desc:'你家里最贵的是一块什么都没放的空地。你不怕房间空，你怕的是被塞满，因为留出来的地方才有呼吸。你接受东西会旧、会裂、会不对称，甚至觉得那样才对。',
    hook:'你留白的地方最贵' },

  { no:'06', school:'奶油软装', role:'云朵体质',
    main:'#F7E9DD', pal:['#F7E9DD','#E7CDBB','#D9A7A0','#FFF8F1'],
    c:[0.3, 0.5,   0,   2,   0],
    desc:'你挑的所有颜色，基本都能吃，而且大概率是甜品。你喜欢圆的、软的、毛茸茸的东西，讨厌一切带尖角的家具。你的房间不是给别人看的，是给自己回来瘫着用的。',
    hook:'你选的颜色都能吃' },

  { no:'07', school:'千禧 Y2K', role:'塑料未来',

    c:[2.3,   1, 1.7,-0.8,   1],

var SLOTS=[];   /* 每个人格在 12 道题里出现几次，用于票数归一化 */

function bindVectors(){
  var i,j,k,opt,per;
  SLOTS=new Array(PERSONAS.length).fill(0);
  for(i=0;i<QUESTIONS.length;i++){
    for(j=0;j<QUESTIONS[i].o.length;j++){
      opt=QUESTIONS[i].o[j]; per=null;
      for(k=0;k<PERSONAS.length;k++){
        if(PERSONAS[k].no===opt.p){ per=PERSONAS[k]; opt.owner=k; break; }
      }
      opt.v = per ? per.c.slice() : new Array(DIM).fill(0);
      if(per) SLOTS[opt.owner]++;
    }
  }
}
bindVectors();

/* ══════════════════ 三、打分 ══════════════════
   总分 = 你选了某人格自己选项的次数（按它出现几次归一）
        + 0.45 × 全部答案向量和与该人格质心的余弦
   归一化是为了：某人格只出现 4 次、别人出现 6 次，不该因此吃亏。
   票数占主导 → 谁离你的选择最近；余弦只用来细分和平票。            */
function cos(a,b){
  var dot=0,na=0,nb=0,i;
  for(i=0;i<DIM;i++){ dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  if(na===0||nb===0) return 0;
  return dot/Math.sqrt(na*nb);
}
function answerVector(ansArr){
  var U=new Array(DIM).fill(0), i, k, o;
  for(i=0;i<QUESTIONS.length;i++){
    if(ansArr[i]==null) continue;
    o=QUESTIONS[i].o[ansArr[i]];
    for(k=0;k<DIM;k++) U[k]+=o.v[k];
  }
  return U;
}
function pickPersona(ansArr){
  var U=new Array(DIM).fill(0), votes=new Array(PERSONAS.length).fill(0), i, k, o, s;
  for(i=0;i<QUESTIONS.length;i++){
    if(ansArr[i]==null) continue;
    o=QUESTIONS[i].o[ansArr[i]];
    for(k=0;k<DIM;k++) U[k]+=o.v[k];
    votes[o.owner]+=1/(SLOTS[o.owner]||1);
  }
  var best=-Infinity, bestIdx=0;
  for(i=0;i<PERSONAS.length;i++){
    s=votes[i]+0.45*cos(U,PERSONAS[i].c);
    if(s>best+1e-9){ best=s; bestIdx=i; }  /* 完全并列取编号靠前，保证同答案同结果 */
  }
  return PERSONAS[bestIdx];
}

/* ══════════════════ 四、状态与存储 ══════════════════ */
var PKEY='ap_progress_v1', HKEY='ap_hist_v1';
var ans=new Array(QUESTIONS.length).fill(null);
var idx=0, current=null, lastNo=null;
var cardCanvas=null;

function saveProgress(){
  try{ localStorage.setItem(PKEY, JSON.stringify({i:idx, a:ans})); }catch(e){}
}
function loadProgress(){
  try{
    var raw=localStorage.getItem(PKEY);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o||!Array.isArray(o.a)||o.a.length!==QUESTIONS.length) return null;
    return o;
  }catch(e){ return null; }
}
function clearProgress(){ try{ localStorage.removeItem(PKEY); }catch(e){} }
function loadHist(){
  try{
    var raw=localStorage.getItem(HKEY);
    if(!raw) return [];
    var a=JSON.parse(raw);
    return Array.isArray(a)?a:[];
  }catch(e){ return []; }
}
function pushHist(no){
  var h=loadHist(); h.push(no); if(h.length>20) h=h.slice(-20);
  try{ localStorage.setItem(HKEY, JSON.stringify(h)); }catch(e){}
  var prev=null;
  for(var i=h.length-2;i>=0;i--){ if(h[i]!==no){ prev=h[i]; break; } }
  return prev;
}
function personaByNo(no){
  for(var i=0;i<PERSONAS.length;i++) if(PERSONAS[i].no===no) return PERSONAS[i];
  return null;
}

/* ══════════════════ 五、屏幕切换 ══════════════════ */
function show(id){
  var all=document.querySelectorAll('.screen');
  for(var i=0;i<all.length;i++) all[i].classList.toggle('on', all[i].id===id);
  window.scrollTo(0,0);
}

/* ══════════════════ 六、答题 ══════════════════ */
function renderQ(){
  var q=QUESTIONS[idx];
  $('qnum').textContent=(idx+1)+' / '+QUESTIONS.length;
  $('bar').style.width=(((idx+1)/QUESTIONS.length)*100).toFixed(1)+'%';
  $('qtext').textContent=q.q;
  var box=$('opts');
  box.innerHTML='';
  for(var i=0;i<q.o.length;i++){
    (function(i){
      var b=document.createElement('button');
      b.type='button';
      b.className='opt'+(ans[idx]===i?' sel':'');
      var ol=document.createElement('span'); ol.className='ol'; ol.textContent='ABCD'.charAt(i);
      var ot=document.createElement('span'); ot.className='ot'; ot.textContent=q.o[i].t;
      b.appendChild(ol); b.appendChild(ot);
      b.addEventListener('click',function(){ choose(i); });
      box.appendChild(b);
    })(i);
  }
  var back=$('back');
  back.classList.toggle('off', idx===0);
}
function choose(i){
  ans[idx]=i;
  saveProgress();
  renderQ();
  setTimeout(function(){
    if(idx<QUESTIONS.length-1){ idx++; saveProgress(); renderQ(); }
    else finish();
  },150);
}
function finish(){
  show('s-calc');
  var words=['正在判断你的灰…','正在数你家里的颜色…','正在看你有多舍不得旧东西…','正在读你留白的地方…'];
  $('calctext').textContent=words[Math.floor(Math.random()*words.length)];
  setTimeout(function(){
    current=pickPersona(ans);
    lastNo=pushHist(current.no);
    clearProgress();
    renderResult();
    show('s-result');
  },900);
}

/* ══════════════════ 七、结果页 ══════════════════ */
function relLum(hex){
  var c=hex.replace('#','');
  var r=parseInt(c.substr(0,2),16)/255,
      g=parseInt(c.substr(2,2),16)/255,
      b=parseInt(c.substr(4,2),16)/255;
  var f=function(v){ return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
/* 在深字/白字之间取对比度更高的那个，避免「浅灰底配白字」这种糊成一片 */
function inkOn(hex){
  var L=relLum(hex);
  var white=1.05/(L+0.05);
  var dark=(L+0.05)/0.058;
  return dark>white ? '#171613' : '#FFFFFF';
}
function renderResult(){
  var p=current;
  var fg=inkOn(p.main);
  var dim = fg==='#FFFFFF' ? 'rgba(255,255,255,.72)' : 'rgba(23,22,19,.62)';
  document.documentElement.style.setProperty('--accent',p.main);
  document.documentElement.style.setProperty('--hfg',fg);
  /* 极浅的人格主色当竖线会看不见，改用中性深灰，保证金句的竖线始终看得见 */
  document.documentElement.style.setProperty('--accentrule',
    relLum(p.main)>0.62 ? 'rgba(23,22,19,.30)' : p.main);
  $('r-no').textContent='No.'+p.no;
  $('r-school').textContent=p.school;
  $('r-role').textContent=p.role;
  $('r-desc').textContent=p.desc;
  $('r-hook').textContent=p.hook;
  $('r-hook').style.color='inherit';
  $('s-result').querySelector('.sectitle').style.color='';
  var pal=$('r-pal');
  pal.innerHTML='';
  for(var i=0;i<p.pal.length;i++){
    var d=document.createElement('div'); d.className='sw';
    var s=document.createElement('i'); s.style.background=p.pal[i];
    var t=document.createElement('span'); t.textContent=p.pal[i].toUpperCase();
    d.appendChild(s); d.appendChild(t); pal.appendChild(d);
  }
  var last=$('r-last');
  if(lastNo){
    var lp=personaByNo(lastNo);
    if(lp){
      last.hidden=false;
      last.textContent='上一次你是 No.'+lp.no+' '+lp.role+' · 审美不是固定的，结果也不会';
    } else last.hidden=true;
  } else last.hidden=true;
  // 顶部色块文字颜色（用 CSS 变量控制）
  var hero=$('s-result').querySelector('.hero');
  hero.style.color=fg;
  hero.style.background=p.main;
  document.querySelectorAll('#s-result .no,#s-result .school').forEach(function(el){ el.style.color=fg; });
}

/* ══════════════════ 八、结果卡 ══════════════════ */
var CW=1242, CH=1656, SCALE=2;
var FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
var FONT_EN='"Helvetica Neue",Helvetica,Arial,sans-serif';

function tracked(g,text,x,y,size,color,track,align,totalW){
  g.font=size+'px '+FONT_EN;
  g.fillStyle=color;
  g.textBaseline='alphabetic';
  var w=0,i,ch;
  for(i=0;i<text.length;i++) w+=g.measureText(text.charAt(i)).width+track;
  w-=track;
  var cx = align==='right' ? (x-w) : x;
  for(i=0;i<text.length;i++){
    ch=text.charAt(i);
    g.fillText(ch,cx,y);
    cx+=g.measureText(ch).width+track;
  }
  return w;
}
function wrapCJK(g,text,maxW,noStart){
  var lines=[], line='', i, ch, test;
  for(i=0;i<text.length;i++){
    ch=text.charAt(i);
    test=line+ch;
    if(g.measureText(test).width>maxW && line){
      if(noStart.indexOf(ch)>=0){ line=test; continue; }
      lines.push(line); line=ch;
    } else line=test;
  }
  if(line) lines.push(line);
  return lines;
}
function drawCard(cv,p){
  var k=SCALE;
  cv.width=CW*k; cv.height=CH*k;
  var g=cv.getContext('2d');
  var pad=96*k, W=CW*k, H=CH*k;
  var fg=inkOn(p.main);
  var dim = fg==='#FFFFFF' ? 'rgba(255,255,255,.74)' : 'rgba(23,22,19,.72)';
  var faint= fg==='#FFFFFF' ? 'rgba(255,255,255,.26)' : 'rgba(23,22,19,.22)';
  var line = fg==='#FFFFFF' ? 'rgba(255,255,255,.46)' : 'rgba(23,22,19,.40)';
  /* 色板底板：人格主色本身是第一格，不垫一层会和卡片背景糊在一起 */
  var plate= fg==='#FFFFFF' ? 'rgba(0,0,0,.16)' : 'rgba(23,22,19,.10)';

  // 底色：纯色平涂
  g.fillStyle=p.main; g.fillRect(0,0,W,H);

  // 顶部细线
  g.fillStyle=faint; g.fillRect(pad, 118*k, W-pad*2, Math.max(1,k));

  // 顶部小字
  tracked(g,'AESTHETIC PERSONA', pad, 186*k, 27*k, dim, 5.5*k, 'left');
  tracked(g,'No.'+p.no, W-pad, 186*k, 27*k, dim, 5.5*k, 'right');

  // 流派
  g.fillStyle=dim;
  g.font=(56*k)+'px '+FONT;
  g.textBaseline='alphabetic';
  g.fillText(p.school, pad, 384*k);

  // 人设
  g.fillStyle=fg;
  g.font='700 '+(136*k)+'px '+FONT;
  g.fillText(p.role, pad, 528*k);

  // 描述
  g.fillStyle=fg;
  g.globalAlpha=0.94;
  g.font=(41*k)+'px '+FONT;
  var lines=wrapCJK(g,p.desc,W-pad*2,'。，、；：！？）」』%');
  if(lines.length>4){
    g.font=(37*k)+'px '+FONT;
    lines=wrapCJK(g,p.desc,W-pad*2,'。，、；：！？）」』%');
  }
  var lh=70*k, y0=676*k;
  for(var i=0;i<lines.length && i<4;i++) g.fillText(lines[i], pad, y0+i*lh);
  g.globalAlpha=1;

  // 分隔线（描边色，保证在深/浅底上都看得见）
  var ly=1024*k;
  g.fillStyle=line; g.fillRect(pad, ly, W-pad*2, Math.max(1,k));

  // 金句
  g.fillStyle=fg;
  g.font='700 '+(60*k)+'px '+FONT;
  g.fillText(p.hook, pad, 1112*k);

  // 四色卡
  var gap=14*k, swW=(W-pad*2-gap*3)/4, swH=100*k, sy=1226*k;
  var pl=10*k;
  g.fillStyle=plate;
  g.fillRect(pad-pl, sy-pl, W-pad*2+pl*2, swH+pl*2);
  for(var j=0;j<4;j++){
    var x=pad+j*(swW+gap);
    g.fillStyle=p.pal[j];
    g.fillRect(x, sy, swW, swH);
  }
  // hex
  g.fillStyle=dim;
  g.font=(23*k)+'px '+FONT_EN;
  for(var m=0;m<4;m++){
    g.fillText(p.pal[m].toUpperCase(), pad+m*(swW+gap), sy+swH+40*k);
  }

  // 页脚
  g.fillStyle=dim;
  g.font=(24*k)+'px '+FONT;
  g.fillText('审美人格测试 · 娱乐向，不必当真', pad, 1560*k);
  tracked(g,'12 QUESTIONS / 10 PERSONAS', W-pad, 1560*k, 20*k, dim, 3*k, 'right');
}

/* ══════════════════ 九、导出 ══════════════════ */
function downloadBlob(blob,name){
  var a=document.createElement('a'), url=URL.createObjectURL(blob);
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },3000);
}
function fileNameFor(p){
  return '审美人格_No'+p.no+'_'+p.role+'.png';
}
function saveCard(){
  if(!cardCanvas){ return; }
  var p=current, name=fileNameFor(p);
  var canPicker=(typeof window.showSaveFilePicker==='function');
  cardCanvas.toBlob(function(blob){
    if(!blob){ return; }
    if(!canPicker){ downloadBlob(blob,name); return; }
    window.showSaveFilePicker({
      suggestedName:name,
      types:[{description:'PNG 图片',accept:{'image/png':['.png']}}]
    }).then(function(handle){
      return handle.createWritable().then(function(w){
        return w.write(blob).then(function(){ return w.close(); });
      });
    }).catch(function(err){
      if(err && err.name==='AbortError') return;
      downloadBlob(blob,name);
    });
  },'image/png');
}

/* ══════════════════ 十、事件绑定 ══════════════════ */
$('startbtn').addEventListener('click',function(){
  ans=new Array(QUESTIONS.length).fill(null); idx=0;
  clearProgress();
  renderQ(); show('s-quiz');
});
$('back').addEventListener('click',function(){
  if(idx>0){ idx--; saveProgress(); renderQ(); }
});
$('cardbtn').addEventListener('click',function(){
  if(!current) return;
  $('cardstate').textContent='正在生成…';
  setTimeout(function(){
    var cv=document.createElement('canvas');
    drawCard(cv,current);
    cardCanvas=cv;
    var img=$('cardimg');
    img.onload=function(){ $('cardstate').textContent='3 : 4 · 可存图'; };
    img.src=cv.toDataURL('image/png');
    show('s-card');
  },30);
});
$('backbtn').addEventListener('click',function(){ show('s-result'); });
$('savebtn').addEventListener('click',saveCard);
$('againbtn').addEventListener('click',function(){
  ans=new Array(QUESTIONS.length).fill(null); idx=0;
  clearProgress(); renderQ(); show('s-quiz');
});

(function init(){
  var saved=loadProgress();
  var rb=$('resumebtn');
  if(saved && saved.i>0 && saved.a.some(function(x){ return x!=null; })){
    rb.hidden=false;
    rb.textContent='继续上次进度（第 '+(saved.i+1)+' 题）';
    rb.addEventListener('click',function(){
      ans=saved.a.slice(); idx=Math.min(saved.i,QUESTIONS.length-1);
      renderQ(); show('s-quiz');
    });
  }
  var h=loadHist();
  if(h.length && !$('resumebtn').hidden===false){}
})();

/* 调试钩子（供自动化验证使用，不影响运行） */
window.__AP={ QUESTIONS:QUESTIONS, PERSONAS:PERSONAS, answerVector:answerVector,
  pickPersona:pickPersona, cos:cos, drawCard:drawCard, inkOn:inkOn, SLOTS:function(){return SLOTS;} };
})();
</script>
